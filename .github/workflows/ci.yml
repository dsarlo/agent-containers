name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:ci-yaml
      - run: npm test
      - run: npm run test:cli-setup-smoke
      - run: npm run test:native-packaging-contract
      - run: npm run verify:native-packaging-contract
      - run: npm run verify:native-helper-packaging-contract
      - run: npm run test:native-helper-packaging-contract

  windows-lifecycle:
    name: Windows Node lifecycle
    runs-on: windows-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm test

  native-durability:
    name: Native durability (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-x64
            publication_mode: strict
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
            publication_mode: strict
          - runner: macos-15-intel
            artifact: darwin-x64
            publication_mode: strict
          - runner: macos-14
            artifact: darwin-arm64
            publication_mode: strict
          - runner: windows-latest
            artifact: win32-x64
            publication_mode: recoverable
          - runner: windows-11-arm
            artifact: win32-arm64
            publication_mode: recoverable
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:native
        env:
          EXPECTED_NATIVE_PUBLICATION_MODE: ${{ matrix.publication_mode }}
      - run: npm run verify:ci-yaml
      - run: npm test
      - run: npm run native:prebuild
      # actions/upload-artifact v5
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: native-prebuild-${{ matrix.artifact }}
          path: prebuilds
          if-no-files-found: error

  assemble-native-package:
    name: Assemble cross-platform native package
    needs: native-durability
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      # actions/download-artifact v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: native-prebuild-*
          path: .
          merge-multiple: true
      - run: npm run native:verify-prebuilds
      - run: mkdir native-package && npm pack --pack-destination native-package
      - run: node scripts/verify-native-package-tarball.mjs native-package/*.tgz
      # actions/upload-artifact v5
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: native-package
          path: native-package/*.tgz
          if-no-files-found: error

  native-package-smoke:
    name: Native package smoke (${{ matrix.artifact }})
    needs: assemble-native-package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-x64
            publication_mode: strict
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
            publication_mode: strict
          - runner: macos-15-intel
            artifact: darwin-x64
            publication_mode: strict
          - runner: macos-14
            artifact: darwin-arm64
            publication_mode: strict
          - runner: windows-latest
            artifact: win32-x64
            publication_mode: recoverable
          - runner: windows-11-arm
            artifact: win32-arm64
            publication_mode: recoverable
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.0
          cache: npm
      # actions/download-artifact v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-package
          path: native-package
      - name: Install assembled package without lifecycle downloads
        shell: bash
        run: mkdir .packed-native && npm install --prefix .packed-native ./native-package/*.tgz
      - name: Load and smoke-test installed production native adapter
        run: node scripts/test-native.mjs
        env:
          PACKED_NATIVE_PACKAGE_DIR: ${{ github.workspace }}/.packed-native/node_modules/@dsarlo/agent-containers
          EXPECTED_NATIVE_PUBLICATION_MODE: ${{ matrix.publication_mode }}
      - name: Exercise installed CLI setup interface
        run: node .packed-native/node_modules/@dsarlo/agent-containers/scripts/test-cli-setup-smoke.mjs
        env:
          PACKED_NATIVE_PACKAGE_DIR: ${{ github.workspace }}/.packed-native/node_modules/@dsarlo/agent-containers

  helper-artifacts:
    name: Package-owned remote helper artifacts
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Verify committed static Linux helper pins before any rebuild
        run: npm run verify:native-helper-packaging-contract
      - run: npm run test:native-helper-packaging-contract
      - name: Build the pinned helper toolchain
        run: docker build --pull=false --tag agent-containers-helper-toolchain:ci --file native/helper/Dockerfile.toolchain .
      - name: Rebuild static Linux helpers in the pinned toolchain and compare committed pins
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create -v "$GITHUB_WORKSPACE:/workspace:ro" agent-containers-helper-toolchain:ci sh -lc 'set -e; mkdir /out; make -C /workspace/native/helper BIN_DIR=/out')"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker start -a "$cid"
          mkdir -p .helper-rebuild
          docker cp "$cid:/out/." .helper-rebuild/
          AGENT_CONTAINERS_HELPER_REBUILD_DIR=.helper-rebuild npm run verify:helper-reproducible
      - run: npm run verify:native-helper-packaging-contract
      - run: npm run test:native-helper-packaging-contract
      # actions/upload-artifact v5
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: helper-artifacts
          path: |
            native/helper/bin
            native/helper/manifest.json
          if-no-files-found: error

  live-devcontainer:
    name: Live Dev Containers lifecycle
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npm install --global @devcontainers/cli@0.89.0
      - name: Require Docker, Dev Containers, and relative linked-worktree support
        run: |
          docker version
          devcontainer --version
          worktree_help="$(git worktree add -h 2>&1 || true)"
          grep -Eq -- '(^|[[:space:]])--(\[no-\])?relative-paths([[:space:]]|$)' <<<"${worktree_help}"
      - run: AGENT_CONTAINERS_REQUIRE_LIVE_INTEGRATION=1 npm run test:integration
